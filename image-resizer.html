<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Resizer — EasyToolz</title>
  <meta name="description" content="Free online Image Resizer — resize images to any dimension instantly in your browser." />
  <link rel="canonical" href="https://easytoolz.click/tools/image-resizer.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Image Resizer</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon images">📐</div><div><h1>Image Resizer</h1><p>Resize images to any dimension — no upload required</p></div></div>
  <div class="tool-layout">
    <div class="tool-box">
      <div id="dropZone2" style="border:2px dashed var(--border);border-radius:var(--radius);padding:40px;text-align:center;cursor:pointer;transition:all 0.2s;" onclick="document.getElementById('imgInput2').click()">
        <div style="font-size:2.5rem;margin-bottom:8px;">📁</div>
        <div style="font-weight:600;margin-bottom:4px;">Drop image or click to browse</div>
        <div style="font-size:0.8rem;color:var(--text-3);">JPG, PNG, WebP, GIF</div>
        <input type="file" id="imgInput2" accept="image/*" style="display:none;" onchange="loadImg(this.files[0])" />
      </div>
      <div id="resizeForm" style="display:none;margin-top:20px;">
        <div style="font-size:0.8rem;color:var(--text-3);margin-bottom:12px;">Original: <span id="origDims"></span></div>
        <!-- Preset sizes -->
        <div style="font-size:0.82rem;margin-bottom:10px;font-weight:600;">Quick Presets</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
          <button class="btn btn-sm btn-secondary" onclick="setSize(800,600)">800×600</button>
          <button class="btn btn-sm btn-secondary" onclick="setSize(1280,720)">1280×720 HD</button>
          <button class="btn btn-sm btn-secondary" onclick="setSize(1920,1080)">1920×1080 FHD</button>
          <button class="btn btn-sm btn-secondary" onclick="setSize(1080,1080)">1080×1080</button>
          <button class="btn btn-sm btn-secondary" onclick="setSize(800,800)">800×800</button>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Width (px)</label><input type="number" id="newW" class="form-input" oninput="sync('w')" /></div>
          <div class="form-group"><label class="form-label">Height (px)</label><input type="number" id="newH" class="form-input" oninput="sync('h')" /></div>
        </div>
        <div class="toggle-row"><span class="toggle-label">Maintain Aspect Ratio</span><button class="toggle on" id="lockRatio" onclick="this.classList.toggle('on')"></button></div>
        <br/>
        <button class="btn btn-primary btn-block" onclick="resizeImg()">Resize & Download</button>
        <div id="resPreview" style="margin-top:16px;display:none;"><img id="resImg" style="max-width:100%;border-radius:8px;border:1px solid var(--border);" /></div>
      </div>
    </div>
    <div class="sidebar"><div class="ad-slot"><p>Advertisement</p></div></div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="../js/main.js"></script>
<script>
  let img=null,origW=0,origH=0;
  function loadImg(f){
    if(!f)return;
    const url=URL.createObjectURL(f);
    img=new Image();
    img.onload=()=>{
      origW=img.width; origH=img.height;
      document.getElementById('origDims').textContent=origW+'×'+origH+' px';
      document.getElementById('newW').value=origW;
      document.getElementById('newH').value=origH;
      document.getElementById('resizeForm').style.display='';
    };
    img.src=url;
  }
  function setSize(w,h){document.getElementById('newW').value=w;document.getElementById('newH').value=h;}
  function sync(changed){
    if(!document.getElementById('lockRatio').classList.contains('on'))return;
    const ratio=origW/origH;
    if(changed==='w'){document.getElementById('newH').value=Math.round(document.getElementById('newW').value/ratio);}
    else{document.getElementById('newW').value=Math.round(document.getElementById('newH').value*ratio);}
  }
  function resizeImg(){
    const w=parseInt(document.getElementById('newW').value);
    const h=parseInt(document.getElementById('newH').value);
    if(!w||!h)return alert('Enter dimensions.');
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    const url=c.toDataURL('image/jpeg',0.92);
    document.getElementById('resImg').src=url;
    document.getElementById('resPreview').style.display='';
    const a=document.createElement('a');a.href=url;a.download='resized_'+w+'x'+h+'.jpg';a.click();
  }
</script>
</body></html>
