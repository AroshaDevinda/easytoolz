<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Split — EasyToolz</title>
  <meta name="description" content="Free PDF Splitter — split a PDF into individual pages, fixed ranges, or custom page ranges. No upload, 100% browser-based." />
  <link rel="canonical" href="https://easytoolz.click/tools/pdf-split.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">PDF Split</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon pdf">✂️</div><div><h1>PDF Split</h1><p>Split a PDF into individual pages or custom ranges — free & private</p></div></div>
  <div class="tool-layout full-width" style="max-width:680px;">
    <div class="tool-box">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
        <div class="drop-icon">📄</div>
        <div class="drop-text">Click or drag & drop a PDF here</div>
        <div class="drop-sub">File stays on your device — never uploaded</div>
        <input type="file" id="pdfInput" accept=".pdf,application/pdf" style="display:none" onchange="loadPDF(this.files[0])" />
      </div>
      <div id="controls" style="display:none;margin-top:20px;">
        <div id="fileInfo" style="font-size:.85rem;color:var(--text-3);margin-bottom:16px;"></div>
        <div class="form-group">
          <label class="form-label">Split Mode</label>
          <select id="mode" class="form-select" onchange="updateMode()">
            <option value="all">Each page as separate PDF</option>
            <option value="range">Custom page ranges</option>
            <option value="fixed">Every N pages</option>
          </select>
        </div>
        <div id="rangeGroup" class="form-group" style="display:none;">
          <label class="form-label">Page Ranges <span style="color:var(--text-3);font-weight:400;">(e.g. 1-3, 4-6, 7)</span></label>
          <input type="text" id="ranges" class="form-input" placeholder="1-3, 4-6, 7" />
        </div>
        <div id="fixedGroup" class="form-group" style="display:none;">
          <label class="form-label">Pages per split</label>
          <input type="number" id="fixedN" class="form-input" value="2" min="1" />
        </div>
        <button class="btn btn-primary btn-block" onclick="doSplit()">✂️ Split PDF</button>
        <div id="loading" style="display:none;text-align:center;padding:16px;color:var(--text-2);">⏳ Splitting…</div>
        <div id="errMsg" style="display:none;color:#f87171;margin-top:12px;"></div>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../js/main.js"></script>
<script>
const { PDFDocument } = PDFLib;
let pdfDoc = null, totalPages = 0, fileName = '';

const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave', ()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop', e=>{e.preventDefault();dz.classList.remove('drag-over');loadPDF(e.dataTransfer.files[0]);});

async function loadPDF(file) {
  if (!file||file.type!=='application/pdf'){showErr('Please select a valid PDF.');return;}
  fileName = file.name.replace(/\.pdf$/i,'');
  const buf = await file.arrayBuffer();
  try {
    pdfDoc = await PDFDocument.load(buf);
    totalPages = pdfDoc.getPageCount();
    document.getElementById('fileInfo').textContent = `📄 ${file.name} · ${totalPages} pages`;
    document.getElementById('controls').style.display = '';
    document.getElementById('errMsg').style.display = 'none';
  } catch(e){showErr('Could not read PDF. It may be corrupt or password-protected.');}
}
function updateMode(){
  const m=document.getElementById('mode').value;
  document.getElementById('rangeGroup').style.display=m==='range'?'':'none';
  document.getElementById('fixedGroup').style.display=m==='fixed'?'':'none';
}
function parseRanges(str){
  const parts=str.split(',').map(s=>s.trim()).filter(Boolean);
  return parts.map(p=>{
    if(p.includes('-')){const[a,b]=p.split('-').map(Number);return{start:a-1,end:b-1};}
    const n=parseInt(p); return{start:n-1,end:n-1};
  });
}
async function doSplit(){
  if(!pdfDoc)return;
  document.getElementById('loading').style.display='block';
  document.getElementById('errMsg').style.display='none';
  const mode=document.getElementById('mode').value;
  try{
    let groups=[];
    if(mode==='all'){for(let i=0;i<totalPages;i++)groups.push([i]);}
    else if(mode==='fixed'){const n=parseInt(document.getElementById('fixedN').value)||1;for(let i=0;i<totalPages;i+=n)groups.push([...Array(Math.min(n,totalPages-i))].map((_,j)=>i+j));}
    else{const ranges=parseRanges(document.getElementById('ranges').value);if(!ranges.length){showErr('Enter at least one range.');document.getElementById('loading').style.display='none';return;}ranges.forEach(r=>{const pages=[];for(let i=r.start;i<=Math.min(r.end,totalPages-1);i++)pages.push(i);if(pages.length)groups.push(pages);});}
    for(let g=0;g<groups.length;g++){
      const newDoc=await PDFDocument.create();
      const copied=await newDoc.copyPages(pdfDoc,groups[g]);
      copied.forEach(p=>newDoc.addPage(p));
      const bytes=await newDoc.save();
      const blob=new Blob([bytes],{type:'application/pdf'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download=groups.length===1?`${fileName}-split.pdf`:`${fileName}-part${g+1}.pdf`;
      a.click(); await new Promise(r=>setTimeout(r,300));
    }
  }catch(e){showErr('Split failed: '+e.message);}
  document.getElementById('loading').style.display='none';
}
function showErr(m){document.getElementById('errMsg').textContent=m;document.getElementById('errMsg').style.display='block';}
</script>
<style>
.drop-zone{border:2px dashed var(--border-hover);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--teal);background:rgba(0,212,170,.04)}
.drop-icon{font-size:3rem;margin-bottom:12px}.drop-text{font-weight:600;margin-bottom:6px}.drop-sub{font-size:.8rem;color:var(--text-3)}
</style>
</body></html>
