<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Color Extractor — EasyToolz</title>
  <meta name="description" content="Free Image Color Extractor — extract dominant colors and palette from any image in your browser. No upload needed." />
  <link rel="canonical" href="https://easytoolz.click/tools/image-color-extractor.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Image Color Extractor</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon images">🎨</div><div><h1>Image Color Extractor</h1><p>Extract dominant colors & palette from any image — free & private</p></div></div>
  <div class="tool-layout full-width" style="max-width:720px;">
    <div class="tool-box">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('imgInput').click()">
        <div class="drop-icon">🎨</div>
        <div class="drop-text">Click or drag & drop an image here</div>
        <div class="drop-sub">JPG, PNG, WebP supported</div>
        <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="loadFile(this.files[0])" />
      </div>
      <div id="result" style="display:none;margin-top:20px;">
        <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:20px;">
          <img id="prevImg" style="max-width:200px;max-height:200px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border);" />
          <div style="flex:1;">
            <div style="font-size:0.85rem;color:var(--text-3);margin-bottom:12px;">Dominant Colors (click to copy HEX)</div>
            <div id="swatches" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
          </div>
        </div>
        <div style="font-size:0.85rem;color:var(--text-3);margin-bottom:10px;">Full Palette</div>
        <div id="palette" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
        <button class="btn btn-secondary" style="margin-top:16px;" onclick="changeImage()">Change Image</button>
      </div>
      <div id="loading" style="display:none;text-align:center;padding:20px;color:var(--text-2);">⏳ Analyzing colors…</div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="../js/main.js"></script>
<script>
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]); });

function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      document.getElementById('prevImg').src = e.target.result;
      document.getElementById('dropZone').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      setTimeout(() => extractColors(img), 50);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function changeImage() { document.getElementById('dropZone').style.display=''; document.getElementById('result').style.display='none'; }

function extractColors(img) {
  const canvas = document.createElement('canvas');
  const MAX = 150;
  const scale = Math.min(MAX/img.naturalWidth, MAX/img.naturalHeight, 1);
  canvas.width  = Math.round(img.naturalWidth  * scale);
  canvas.height = Math.round(img.naturalHeight * scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  // Quantize to buckets of 32
  const counts = {};
  for (let i = 0; i < data.length; i += 4) {
    if (data[i+3] < 128) continue;
    const r = data[i] >> 5, g = data[i+1] >> 5, b = data[i+2] >> 5;
    const key = `${r},${g},${b}`;
    counts[key] = (counts[key] || 0) + 1;
  }
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 20);
  const toHex = ([r,g,b]) => '#' + [r,g,b].map(v => ((v<<5)+16).toString(16).padStart(2,'0')).join('');
  const colors = sorted.map(([k]) => toHex(k.split(',').map(Number)));

  // Swatches (top 6)
  const sw = document.getElementById('swatches');
  sw.innerHTML = '';
  colors.slice(0,6).forEach(hex => {
    const div = document.createElement('div');
    div.title = 'Click to copy';
    div.style.cssText = `width:56px;height:56px;border-radius:10px;background:${hex};cursor:pointer;border:2px solid rgba(255,255,255,0.15);position:relative;`;
    div.onclick = () => { navigator.clipboard.writeText(hex); div.title='Copied!'; };
    const label = document.createElement('div');
    label.style.cssText = 'position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:0.65rem;color:var(--text-3);white-space:nowrap;';
    label.textContent = hex;
    div.appendChild(label);
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'position:relative;margin-bottom:24px;';
    wrapper.appendChild(div);
    sw.appendChild(wrapper);
  });
  // Full palette
  const pal = document.getElementById('palette');
  pal.innerHTML = '';
  colors.forEach(hex => {
    const div = document.createElement('div');
    div.style.cssText = `display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;`;
    div.innerHTML = `<div style="width:20px;height:20px;border-radius:4px;background:${hex};flex-shrink:0;"></div><span style="font-size:0.8rem;font-family:monospace;">${hex}</span>`;
    div.onclick = () => { navigator.clipboard.writeText(hex); div.style.borderColor='var(--teal)'; setTimeout(()=>div.style.borderColor='',1500); };
    pal.appendChild(div);
  });
  document.getElementById('loading').style.display = 'none';
  document.getElementById('result').style.display = '';
}
</script>
<style>
.tool-page-icon.images { background:linear-gradient(135deg,rgba(244,114,182,.15),rgba(244,114,182,.05));color:#f472b6; }
.drop-zone { border:2px dashed var(--border-hover);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s; }
.drop-zone:hover,.drop-zone.drag-over { border-color:var(--teal);background:rgba(0,212,170,.04); }
.drop-icon { font-size:3rem;margin-bottom:12px; }
.drop-text { font-weight:600;margin-bottom:6px; }
.drop-sub  { font-size:.8rem;color:var(--text-3); }
</style>
</body></html>
