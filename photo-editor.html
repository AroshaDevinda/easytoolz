<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Editor — EasyToolz</title>
  <meta name="description" content="Free online Photo Editor — adjust brightness, contrast, saturation, and apply filters to any image in your browser." />
  <link rel="canonical" href="https://easytoolz.click/tools/photo-editor.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Photo Editor</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon images">🖌️</div><div><h1>Photo Editor</h1><p>Adjust brightness, contrast, saturation & apply filters — free</p></div></div>
  <div class="tool-layout full-width" style="max-width:800px;">
    <div class="tool-box">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('imgInput').click()">
        <div class="drop-icon">🖌️</div>
        <div class="drop-text">Click or drag & drop an image here</div>
        <div class="drop-sub">JPG, PNG, WebP, GIF supported</div>
        <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="loadImg(this.files[0])" />
      </div>
      <div id="editor" style="display:none;">
        <div style="display:grid;grid-template-columns:1fr 240px;gap:20px;margin-top:20px;">
          <div>
            <canvas id="previewCanvas" style="max-width:100%;display:block;border-radius:var(--radius);"></canvas>
          </div>
          <div>
            <div style="margin-bottom:16px;">
              <div style="font-size:.8rem;color:var(--text-3);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;">Adjustments</div>
              <div id="sliders"></div>
            </div>
            <div style="margin-bottom:16px;">
              <div style="font-size:.8rem;color:var(--text-3);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;">Filters</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;" id="filterBtns"></div>
            </div>
            <button class="btn btn-secondary btn-block" onclick="resetAll()" style="margin-bottom:8px;">↺ Reset</button>
            <div class="form-group">
              <label class="form-label">Save as</label>
              <select id="fmt" class="form-select"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select>
            </div>
            <button class="btn btn-primary btn-block" onclick="download()">⬇ Download</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="../js/main.js"></script>
<script>
let img=null;
const adjustments={brightness:100,contrast:100,saturation:100,hue:0,blur:0,sharpen:0};
const sliderDefs=[
  {key:'brightness',label:'Brightness',min:0,max:200,default:100},
  {key:'contrast',label:'Contrast',min:0,max:200,default:100},
  {key:'saturation',label:'Saturation',min:0,max:300,default:100},
  {key:'hue',label:'Hue Rotate',min:0,max:360,default:0,unit:'deg'},
  {key:'blur',label:'Blur',min:0,max:10,default:0,unit:'px',step:.5},
];
const filters=['None','Grayscale','Sepia','Invert','Vintage','Cool','Warm','Dramatic','Fade'];
let activeFilter='None';

const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');loadImg(e.dataTransfer.files[0]);});

function loadImg(file){
  if(!file||!file.type.startsWith('image/'))return;
  const reader=new FileReader();
  reader.onload=e=>{
    const i=new Image();
    i.onload=()=>{img=i;buildUI();render();document.getElementById('dropZone').style.display='none';document.getElementById('editor').style.display='';};
    i.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function buildUI(){
  const sc=document.getElementById('sliders');sc.innerHTML='';
  sliderDefs.forEach(d=>{
    sc.innerHTML+=`<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:.78rem;color:var(--text-3);margin-bottom:3px;"><span>${d.label}</span><span id="lbl_${d.key}">${d.default}${d.unit||'%'}</span></div><input type="range" min="${d.min}" max="${d.max}" value="${d.default}" step="${d.step||1}" style="width:100%;accent-color:var(--teal);" oninput="upd('${d.key}',this.value,'${d.unit||'%'}')" /></div>`;
  });
  const fb=document.getElementById('filterBtns');fb.innerHTML='';
  filters.forEach(f=>{
    const btn=document.createElement('button');
    btn.textContent=f;btn.className='btn btn-secondary btn-sm';
    btn.onclick=()=>{activeFilter=f;document.querySelectorAll('#filterBtns button').forEach(b=>b.style.borderColor='');btn.style.borderColor='var(--teal)';render();};
    fb.appendChild(btn);
  });
}
function upd(key,val,unit){
  adjustments[key]=parseFloat(val);
  document.getElementById(`lbl_${key}`).textContent=val+unit;
  render();
}
function getFilterStr(){
  let f=`brightness(${adjustments.brightness}%) contrast(${adjustments.contrast}%) saturate(${adjustments.saturation}%) hue-rotate(${adjustments.hue}deg) blur(${adjustments.blur}px)`;
  if(activeFilter==='Grayscale')f+=' grayscale(100%)';
  else if(activeFilter==='Sepia')f+=' sepia(100%)';
  else if(activeFilter==='Invert')f+=' invert(100%)';
  else if(activeFilter==='Vintage')f+=' sepia(60%) contrast(110%) brightness(90%)';
  else if(activeFilter==='Cool')f+=' hue-rotate(200deg) saturate(120%)';
  else if(activeFilter==='Warm')f+=' hue-rotate(340deg) saturate(130%) brightness(105%)';
  else if(activeFilter==='Dramatic')f+=' contrast(140%) brightness(90%) saturate(110%)';
  else if(activeFilter==='Fade')f+=' brightness(115%) contrast(80%) saturate(70%)';
  return f;
}
function render(){
  if(!img)return;
  const c=document.getElementById('previewCanvas');
  c.width=img.naturalWidth;c.height=img.naturalHeight;
  const ctx=c.getContext('2d');
  ctx.filter=getFilterStr();
  ctx.drawImage(img,0,0);
  ctx.filter='none';
}
function resetAll(){
  sliderDefs.forEach(d=>{adjustments[d.key]=d.default;document.getElementById(`lbl_${d.key}`).textContent=d.default+(d.unit||'%');});
  activeFilter='None';
  document.querySelectorAll('#filterBtns button').forEach(b=>b.style.borderColor='');
  buildUI();render();
}
function download(){
  const fmt=document.getElementById('fmt').value;
  const ext=fmt==='image/png'?'png':fmt==='image/webp'?'webp':'jpg';
  const a=document.createElement('a');a.href=document.getElementById('previewCanvas').toDataURL(fmt,.92);a.download=`edited.${ext}`;a.click();
}
</script>
<style>
.drop-zone{border:2px dashed var(--border-hover);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--teal);background:rgba(0,212,170,.04)}
.drop-icon{font-size:3rem;margin-bottom:12px}.drop-text{font-weight:600;margin-bottom:6px}.drop-sub{font-size:.8rem;color:var(--text-3)}
.tool-page-icon.images{background:linear-gradient(135deg,rgba(244,114,182,.15),rgba(244,114,182,.05));color:#f472b6}
@media(max-width:640px){#editor>div{grid-template-columns:1fr!important}}
</style>
</body></html>
