<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopwatch — EasyToolz</title>
  <meta name="description" content="Free online stopwatch with lap timer. Start, pause, and record laps easily." />
  <link rel="canonical" href="https://easytoolz.click/tools/stopwatch.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Stopwatch</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon daily">⏱️</div><div><h1>Stopwatch</h1><p>Online stopwatch with lap timer</p></div></div>
  <div class="tool-layout full-width" style="max-width:600px;">
    <div class="tool-box" style="text-align:center;">
      <div class="time-display" id="swDisplay">00:00.00</div>
      <div class="time-controls">
        <button class="btn btn-primary" id="startBtn" onclick="startStop()">▶ Start</button>
        <button class="btn btn-secondary" onclick="lap()" id="lapBtn" disabled>⊕ Lap</button>
        <button class="btn btn-danger" onclick="reset()">↺ Reset</button>
      </div>
      <div id="lapSection" style="margin-top:24px;display:none;">
        <div style="display:flex;justify-content:space-between;font-size:0.8rem;color:var(--text-3);margin-bottom:8px;padding:0 12px;">
          <span>Lap</span><span>Split</span><span>Time</span>
        </div>
        <ul class="lap-list" id="lapList"></ul>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="../js/main.js"></script>
<script>
let running=false, startTime=0, elapsed=0, raf, lapStart=0, laps=[], lapCount=0;
function fmt(ms){
  const cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000)%60, m=Math.floor(ms/60000);
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s+'.'+(cs<10?'0':'')+cs;
}
function tick(){ if(!running)return; elapsed=Date.now()-startTime; document.getElementById('swDisplay').textContent=fmt(elapsed); raf=requestAnimationFrame(tick); }
function startStop(){
  running=!running;
  if(running){ startTime=Date.now()-elapsed; if(lapStart===0)lapStart=startTime; tick(); }
  else        { cancelAnimationFrame(raf); }
  document.getElementById('startBtn').textContent=running?'⏸ Pause':'▶ Resume';
  document.getElementById('lapBtn').disabled=!running;
}
function lap(){
  lapCount++;
  const now=elapsed;
  const split=now-(laps.reduce((a,l)=>a+l.split,0));
  laps.push({split});
  const li=document.createElement('li');
  li.innerHTML=`<span class="lap-num">#${lapCount}</span><span>${fmt(split)}</span><span>${fmt(now)}</span>`;
  document.getElementById('lapList').prepend(li);
  document.getElementById('lapSection').style.display='';
}
function reset(){
  running=false; cancelAnimationFrame(raf);
  elapsed=0; lapStart=0; laps=[]; lapCount=0;
  document.getElementById('swDisplay').textContent='00:00.00';
  document.getElementById('startBtn').textContent='▶ Start';
  document.getElementById('lapBtn').disabled=true;
  document.getElementById('lapList').innerHTML='';
  document.getElementById('lapSection').style.display='none';
}
</script>
</body></html>
