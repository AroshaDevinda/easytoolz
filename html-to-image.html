<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML to Image — EasyToolz</title>
  <meta name="description" content="Free HTML to Image converter — render any HTML/CSS code as a PNG image in your browser. No upload needed." />
  <link rel="canonical" href="https://easytoolz.click/tools/html-to-image.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">HTML to Image</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon images">🌐</div><div><h1>HTML to Image</h1><p>Convert HTML/CSS code into a PNG image — free, browser-only</p></div></div>
  <div class="tool-layout full-width" style="max-width:820px;">
    <div class="tool-box">
      <div class="form-group">
        <label class="form-label">HTML Code</label>
        <textarea id="htmlInput" class="form-textarea" style="min-height:200px;font-family:monospace;font-size:.85rem;" placeholder="&lt;div style='padding:40px;background:#1e293b;color:#e2e8f0;font-family:Inter,sans-serif;border-radius:12px;'&gt;&#10;  &lt;h1 style='color:#00d4aa;'&gt;Hello World&lt;/h1&gt;&#10;  &lt;p&gt;This is rendered as an image&lt;/p&gt;&#10;&lt;/div&gt;"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Width (px)</label>
          <input type="number" id="imgWidth" class="form-input" value="800" min="100" max="3000" />
        </div>
        <div class="form-group">
          <label class="form-label">Scale (for retina)</label>
          <select id="scale" class="form-select"><option value="1">1×</option><option value="2" selected>2× (retina)</option><option value="3">3×</option></select>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <button class="btn btn-secondary" onclick="renderPreview()">👁 Preview</button>
        <button class="btn btn-primary" onclick="doCapture()">⬇ Download as PNG</button>
      </div>
      <div id="loading" style="display:none;text-align:center;padding:16px;color:var(--text-2);">⏳ Rendering…</div>
      <div id="errMsg" style="display:none;color:#f87171;margin-top:8px;"></div>
      <div id="previewArea" style="display:none;margin-top:16px;">
        <div style="font-size:.8rem;color:var(--text-3);margin-bottom:8px;">Preview:</div>
        <div id="previewFrame" style="border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff;"></div>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="../js/main.js"></script>
<script>
function renderPreview(){
  const html=document.getElementById('htmlInput').value;
  const frame=document.getElementById('previewFrame');
  frame.innerHTML=html;
  document.getElementById('previewArea').style.display='';
}
async function doCapture(){
  const html=document.getElementById('htmlInput').value;
  if(!html.trim()){showErr('Please enter some HTML code.');return;}
  document.getElementById('loading').style.display='block';
  document.getElementById('errMsg').style.display='none';
  // Load html2canvas dynamically
  if(!window.html2canvas){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      s.onload=res;s.onerror=rej;document.head.appendChild(s);
    });
  }
  try{
    const w=parseInt(document.getElementById('imgWidth').value)||800;
    const scale=parseInt(document.getElementById('scale').value)||2;
    // Create hidden render container
    const container=document.createElement('div');
    container.style.cssText=`position:fixed;left:-9999px;top:0;width:${w}px;`;
    container.innerHTML=html;
    document.body.appendChild(container);
    await new Promise(r=>requestAnimationFrame(r));
    const canvas=await html2canvas(container,{scale,useCORS:true,allowTaint:true,logging:false});
    document.body.removeChild(container);
    const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='html-to-image.png';a.click();
  }catch(e){showErr('Render failed: '+e.message);}
  document.getElementById('loading').style.display='none';
}
function showErr(m){document.getElementById('errMsg').textContent=m;document.getElementById('errMsg').style.display='block';}
</script>
<style>
.tool-page-icon.images{background:linear-gradient(135deg,rgba(244,114,182,.15),rgba(244,114,182,.05));color:#f472b6}
</style>
</body></html>
