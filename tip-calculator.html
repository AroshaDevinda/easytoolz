<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip Calculator — EasyToolz</title>
  <meta name="description" content="Free Tip Calculator — calculate tips and split the bill among friends instantly." />
  <link rel="canonical" href="https://easytoolz.click/tools/tip-calculator.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Tip Calculator</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon calculators">🍽️</div><div><h1>Tip Calculator</h1><p>Calculate tips and split bills among friends</p></div></div>
  <div class="tool-layout full-width" style="max-width:600px;">
    <div class="tool-box">
      <div class="form-group"><label class="form-label">Bill Amount</label><input type="number" id="bill" class="form-input" placeholder="e.g. 1200" oninput="calc()" /></div>
      <div class="form-group">
        <label class="form-label">Tip Percentage: <strong id="tipPctLabel" style="color:var(--teal)">15%</strong></label>
        <div class="range-wrap">
          <span>0%</span>
          <input type="range" id="tipPct" min="0" max="30" value="15" oninput="document.getElementById('tipPctLabel').textContent=this.value+'%';calc()" />
          <span>30%</span>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
          <button class="btn btn-sm btn-secondary" onclick="setTip(10)">10%</button>
          <button class="btn btn-sm btn-secondary" onclick="setTip(15)">15%</button>
          <button class="btn btn-sm btn-secondary" onclick="setTip(18)">18%</button>
          <button class="btn btn-sm btn-secondary" onclick="setTip(20)">20%</button>
          <button class="btn btn-sm btn-secondary" onclick="setTip(25)">25%</button>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Split Between (people)</label><input type="number" id="people" class="form-input" value="1" min="1" oninput="calc()" /></div>
      <div id="tipResult" style="display:none;margin-top:4px;">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
          <div style="background:rgba(0,212,170,0.08);border:1px solid rgba(0,212,170,0.2);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:0.75rem;color:var(--text-3);margin-bottom:6px;">Tip Amount</div>
            <div id="tipAmt" style="font-size:1.3rem;font-weight:800;color:var(--teal);"></div>
          </div>
          <div style="background:rgba(129,140,248,0.08);border:1px solid rgba(129,140,248,0.2);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:0.75rem;color:var(--text-3);margin-bottom:6px;">Total Bill</div>
            <div id="totalBill" style="font-size:1.3rem;font-weight:800;color:var(--purple);"></div>
          </div>
          <div style="background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:0.75rem;color:var(--text-3);margin-bottom:6px;">Per Person</div>
            <div id="perPerson" style="font-size:1.3rem;font-weight:800;color:#34d399;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="../js/main.js"></script>
<script>
  function setTip(v){ document.getElementById('tipPct').value=v; document.getElementById('tipPctLabel').textContent=v+'%'; calc(); }
  function calc(){
    const bill=parseFloat(document.getElementById('bill').value)||0;
    const pct=parseFloat(document.getElementById('tipPct').value)||0;
    const ppl=Math.max(1,parseInt(document.getElementById('people').value)||1);
    const tip=bill*pct/100, total=bill+tip, pp=total/ppl;
    const f=v=>v.toFixed(2);
    document.getElementById('tipAmt').textContent   = '$'+f(tip);
    document.getElementById('totalBill').textContent = '$'+f(total);
    document.getElementById('perPerson').textContent = '$'+f(pp);
    document.getElementById('tipResult').style.display = bill>0?'':'none';
  }
</script>
</body></html>
