<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Add Watermark — EasyToolz</title>
  <meta name="description" content="Free PDF watermark tool — add text watermark to all pages of a PDF in your browser. No upload needed." />
  <link rel="canonical" href="https://easytoolz.click/tools/pdf-add-watermark.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">PDF Add Watermark</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon pdf">💧</div><div><h1>Add Watermark to PDF</h1><p>Stamp any text watermark across all PDF pages — free, browser-only</p></div></div>
  <div class="tool-layout full-width" style="max-width:680px;">
    <div class="tool-box">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
        <div class="drop-icon">📄</div>
        <div class="drop-text">Click or drag & drop a PDF here</div>
        <div class="drop-sub">File never leaves your device</div>
        <input type="file" id="pdfInput" accept=".pdf,application/pdf" style="display:none" onchange="loadPDF(this.files[0])" />
      </div>
      <div id="controls" style="display:none;margin-top:20px;">
        <div id="fileInfo" style="font-size:.85rem;color:var(--text-3);margin-bottom:16px;"></div>
        <div class="form-group">
          <label class="form-label">Watermark Text</label>
          <input type="text" id="waterText" class="form-input" value="CONFIDENTIAL" placeholder="Enter watermark text" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Font Size (pt)</label>
            <input type="number" id="fontSize" class="form-input" value="48" min="10" max="200" />
          </div>
          <div class="form-group">
            <label class="form-label">Opacity</label>
            <input type="range" id="opacity" min="5" max="80" value="20" style="width:100%;margin-top:12px;accent-color:var(--teal);" oninput="document.getElementById('opacLabel').textContent=this.value+'%'" />
            <div id="opacLabel" style="font-size:.75rem;color:var(--text-3);margin-top:4px;">20%</div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Position</label>
            <select id="position" class="form-select">
              <option value="center">Center (diagonal)</option>
              <option value="tile">Tiled</option>
              <option value="bottom">Bottom Center</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Color</label>
            <select id="color" class="form-select">
              <option value="gray">Gray</option>
              <option value="red">Red</option>
              <option value="blue">Blue</option>
              <option value="green">Green</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary btn-block" onclick="doWatermark()">💧 Add Watermark & Download</button>
        <div id="loading" style="display:none;text-align:center;padding:16px;color:var(--text-2);">⏳ Adding watermark…</div>
        <div id="errMsg" style="display:none;color:#f87171;margin-top:12px;"></div>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../js/main.js"></script>
<script>
const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
let rawBuf=null, fileName='';

const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');loadPDF(e.dataTransfer.files[0]);});

async function loadPDF(file){
  if(!file||file.type!=='application/pdf'){showErr('Please select a valid PDF.');return;}
  fileName=file.name.replace(/\.pdf$/i,'');
  rawBuf=await file.arrayBuffer();
  try{
    const d=await PDFDocument.load(rawBuf);
    document.getElementById('fileInfo').textContent=`📄 ${file.name} · ${d.getPageCount()} pages`;
    document.getElementById('controls').style.display='';
  }catch(e){showErr('Could not read PDF.');}
}
function getColor(c){
  if(c==='red')return rgb(0.8,0.1,0.1);
  if(c==='blue')return rgb(0.1,0.1,0.8);
  if(c==='green')return rgb(0.1,0.6,0.1);
  return rgb(0.5,0.5,0.5);
}
async function doWatermark(){
  if(!rawBuf)return;
  document.getElementById('loading').style.display='block';
  document.getElementById('errMsg').style.display='none';
  try{
    const pdfDoc=await PDFDocument.load(rawBuf);
    const font=await pdfDoc.embedFont(StandardFonts.HelveticaBold);
    const pages=pdfDoc.getPages();
    const text=document.getElementById('waterText').value||'WATERMARK';
    const fs=parseInt(document.getElementById('fontSize').value)||48;
    const opacity=parseInt(document.getElementById('opacity').value)/100;
    const pos=document.getElementById('position').value;
    const color=getColor(document.getElementById('color').value);
    pages.forEach(page=>{
      const {width,height}=page.getSize();
      const tw=font.widthOfTextAtSize(text,fs);
      if(pos==='center'){
        page.drawText(text,{x:(width-tw)/2,y:(height-fs)/2,size:fs,font,color,opacity,rotate:degrees(-35)});
      }else if(pos==='tile'){
        for(let y=fs;y<height+fs;y+=fs*3)
          for(let x=-tw;x<width+tw;x+=tw+60)
            page.drawText(text,{x,y,size:fs,font,color,opacity,rotate:degrees(-20)});
      }else{
        page.drawText(text,{x:(width-tw)/2,y:20,size:fs,font,color,opacity});
      }
    });
    const bytes=await pdfDoc.save();
    const blob=new Blob([bytes],{type:'application/pdf'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${fileName}-watermarked.pdf`;a.click();
  }catch(e){showErr('Failed: '+e.message);}
  document.getElementById('loading').style.display='none';
}
function showErr(m){document.getElementById('errMsg').textContent=m;document.getElementById('errMsg').style.display='block';}
</script>
<style>
.drop-zone{border:2px dashed var(--border-hover);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--teal);background:rgba(0,212,170,.04)}
.drop-icon{font-size:3rem;margin-bottom:12px}.drop-text{font-weight:600;margin-bottom:6px}.drop-sub{font-size:.8rem;color:var(--text-3)}
</style>
</body></html>
