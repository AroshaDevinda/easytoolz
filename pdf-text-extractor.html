<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Text Extractor — EasyToolz</title>
  <meta name="description" content="Free PDF Text Extractor — extract all text from any PDF file in your browser. No upload, 100% private." />
  <link rel="canonical" href="https://easytoolz.click/tools/pdf-text-extractor.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">PDF Text Extractor</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon pdf">📋</div><div><h1>PDF Text Extractor</h1><p>Extract all readable text from any PDF — free & private</p></div></div>
  <div class="tool-layout full-width" style="max-width:720px;">
    <div class="tool-box">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
        <div class="drop-icon">📄</div>
        <div class="drop-text">Click or drag & drop a PDF here</div>
        <div class="drop-sub">Text will be extracted from all pages instantly</div>
        <input type="file" id="pdfInput" accept=".pdf,application/pdf" style="display:none" onchange="handleFile(this.files[0])" />
      </div>
      <div id="loading" style="display:none;text-align:center;padding:20px;color:var(--text-2);">⏳ Extracting text…</div>
      <div id="errMsg" style="display:none;color:#f87171;margin-top:12px;"></div>
      <div id="output" style="display:none;margin-top:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span id="wordInfo" style="font-size:0.85rem;color:var(--text-3);"></span>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="copyText(document.getElementById('textOut').value, this)">📋 Copy</button>
            <button class="btn btn-primary btn-sm" onclick="downloadTxt()">⬇ Download .txt</button>
          </div>
        </div>
        <textarea id="textOut" class="form-textarea" style="min-height:360px;font-family:monospace;font-size:0.85rem;" readonly></textarea>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="../js/main.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let extractedText = '';

const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); const f=e.dataTransfer.files[0]; if(f) handleFile(f); });

async function handleFile(file) {
  if (!file || file.type !== 'application/pdf') { showErr('Please select a valid PDF file.'); return; }
  document.getElementById('output').style.display = 'none';
  document.getElementById('errMsg').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let allText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map(item => item.str).join(' ');
      allText += `--- Page ${i} ---\n${pageText}\n\n`;
    }
    extractedText = allText.trim();
    const words = extractedText.split(/\s+/).filter(Boolean).length;
    const chars  = extractedText.length;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('textOut').value = extractedText || '(No readable text found — the PDF may be scanned/image-based)';
    document.getElementById('wordInfo').textContent = `${pdf.numPages} pages · ${words.toLocaleString()} words · ${chars.toLocaleString()} characters`;
    document.getElementById('output').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    showErr('Could not read PDF. It may be corrupt or password-protected.');
  }
}
function downloadTxt() {
  const blob = new Blob([extractedText], { type: 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'extracted-text.txt'; a.click();
}
function showErr(m) { document.getElementById('errMsg').textContent=m; document.getElementById('errMsg').style.display='block'; }
</script>
<style>
.tool-page-icon.pdf { background:linear-gradient(135deg,rgba(251,146,60,.15),rgba(251,146,60,.05));color:#fb923c; }
.drop-zone { border:2px dashed var(--border-hover);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s; }
.drop-zone:hover,.drop-zone.drag-over { border-color:var(--teal);background:rgba(0,212,170,.04); }
.drop-icon { font-size:3rem;margin-bottom:12px; }
.drop-text { font-weight:600;margin-bottom:6px; }
.drop-sub  { font-size:.8rem;color:var(--text-3); }
</style>
</body></html>
