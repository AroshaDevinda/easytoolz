<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — EasyToolz</title>
  <meta name="description" content="Contact EasyToolz.click — send us your feedback, tool suggestions, or bug reports." />
  <link rel="canonical" href="https://easytoolz.click/contact.html" />
  <link rel="stylesheet" href="css/style.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7289505669633482" crossorigin="anonymous"></script>
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main>
  <div class="page-wrap">
    <h1>Contact Us</h1>
    <p class="lead">Have a suggestion, bug report, or just want to say hello? We'd love to hear from you.</p>
    <div class="tool-box" style="margin-bottom:32px;">
      <div class="contact-grid">
        <div class="form-group"><label class="form-label">Your Name</label><input type="text" class="form-input" placeholder="John Doe" /></div>
        <div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-input" placeholder="you@example.com" /></div>
      </div>
      <div class="form-group"><label class="form-label">Subject</label>
        <select class="form-select">
          <option>Tool Suggestion</option>
          <option>Bug Report</option>
          <option>General Feedback</option>
          <option>Business Inquiry</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" style="min-height:160px;" placeholder="Tell us what you think or suggest a new tool…"></textarea></div>
      <button class="btn btn-primary btn-block" onclick="this.textContent='✓ Message Sent! Thank you.';this.disabled=true;this.style.opacity='0.7'">Send Message</button>
    </div>
    <h2>Other Ways to Reach Us</h2>
    <p>📧 Email: <a href="mailto:hello@easytoolz.click" style="color:var(--teal)">hello@easytoolz.click</a></p>
    <p>We typically respond within 24–48 hours.</p>
  </div>
</main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span><div class="footer-links"><a href="privacy-policy.html">Privacy</a><a href="terms.html">Terms</a></div></div></div></footer>
<script src="js/main.js"></script>
</body></html>
