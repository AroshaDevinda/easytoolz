<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator — EasyToolz</title>
  <meta name="description" content="Free strong Password Generator — generate secure random passwords with custom rules instantly." />
  <link rel="canonical" href="https://easytoolz.click/tools/password-generator.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Password Generator</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon utilities">🔐</div><div><h1>Password Generator</h1><p>Generate strong, secure random passwords</p></div></div>
  <div class="tool-layout full-width" style="max-width:600px;">
    <div class="tool-box">
      <!-- Generated password display -->
      <div style="display:flex;gap:10px;margin-bottom:20px;">
        <div id="pwOut" class="output-box" style="flex:1;font-size:1rem;font-weight:600;padding:14px 16px;letter-spacing:0.05em;min-height:unset;">Click generate!</div>
        <button class="btn btn-secondary" onclick="copyText(document.getElementById('pwOut').textContent,this)" style="flex-shrink:0;">Copy</button>
      </div>
      <!-- Strength bar -->
      <div style="margin-bottom:20px;">
        <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:6px;">
          <span style="color:var(--text-3)">Strength</span>
          <span id="strengthLabel" style="font-weight:600;"></span>
        </div>
        <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;">
          <div id="strengthBar" style="height:100%;border-radius:3px;width:0%;transition:all 0.3s;"></div>
        </div>
      </div>
      <!-- Options -->
      <div class="form-group">
        <label class="form-label">Password Length: <strong id="lenLabel" style="color:var(--teal)">16</strong></label>
        <div class="range-wrap">
          <span>6</span>
          <input type="range" id="pwLen" min="6" max="64" value="16" oninput="document.getElementById('lenLabel').textContent=this.value;generate()" />
          <span>64</span>
        </div>
      </div>
      <div class="toggle-row"><span class="toggle-label">Uppercase Letters (A–Z)</span><button class="toggle on" id="tUpper" onclick="toggle('tUpper');generate()"></button></div>
      <div class="toggle-row"><span class="toggle-label">Lowercase Letters (a–z)</span><button class="toggle on" id="tLower" onclick="toggle('tLower');generate()"></button></div>
      <div class="toggle-row"><span class="toggle-label">Numbers (0–9)</span><button class="toggle on" id="tNums"  onclick="toggle('tNums');generate()"></button></div>
      <div class="toggle-row"><span class="toggle-label">Symbols (!@#$%)</span><button class="toggle on" id="tSyms"  onclick="toggle('tSyms');generate()"></button></div>
      <div class="toggle-row"><span class="toggle-label">Exclude Ambiguous (0,O,l,1)</span><button class="toggle"    id="tAmbi"  onclick="toggle('tAmbi');generate()"></button></div>
      <br/>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary btn-block" onclick="generate()">⟳ Generate New Password</button>
      </div>
      <!-- Bulk -->
      <hr class="divider"/>
      <div class="form-group"><label class="form-label">Generate Multiple</label>
        <div class="form-row">
          <input type="number" id="bulkCount" class="form-input" value="5" min="1" max="50" />
          <button class="btn btn-secondary" onclick="genBulk()">Generate</button>
        </div>
      </div>
      <div id="bulkOut" class="output-box" style="min-height:unset;display:none;"></div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="../js/main.js"></script>
<script>
  const UP='ABCDEFGHIJKLMNOPQRSTUVWXYZ', LO='abcdefghijklmnopqrstuvwxyz', NU='0123456789', SY='!@#$%^&*()-_=+[]{}|;:,.<>?', AMB='0O1lI';
  function st(id){return document.getElementById(id).classList.contains('on');}
  function toggle(id){document.getElementById(id).classList.toggle('on'); document.getElementById(id).textContent=document.getElementById(id).classList.contains('on')?'':'';}
  function getChars(){
    let c='';
    if(st('tUpper'))c+=UP; if(st('tLower'))c+=LO; if(st('tNums'))c+=NU; if(st('tSyms'))c+=SY;
    if(st('tAmbi'))c=[...c].filter(ch=>!AMB.includes(ch)).join('');
    return c||LO+NU;
  }
  function genPw(len){const c=getChars();return Array.from({length:len},()=>c[Math.floor(Math.random()*c.length)]).join('');}
  function strength(pw){
    let s=0;
    if(pw.length>=8)s+=20; if(pw.length>=12)s+=15; if(pw.length>=16)s+=15;
    if(/[A-Z]/.test(pw))s+=10; if(/[a-z]/.test(pw))s+=10;
    if(/[0-9]/.test(pw))s+=10; if(/[^A-Za-z0-9]/.test(pw))s+=20;
    return Math.min(100,s);
  }
  function generate(){
    const len=parseInt(document.getElementById('pwLen').value);
    const pw=genPw(len);
    document.getElementById('pwOut').textContent=pw;
    const s=strength(pw);
    const bar=document.getElementById('strengthBar');
    const lbl=document.getElementById('strengthLabel');
    bar.style.width=s+'%';
    if(s<40){bar.style.background='#f87171';lbl.textContent='Weak';lbl.style.color='#f87171';}
    else if(s<70){bar.style.background='#fbbf24';lbl.textContent='Fair';lbl.style.color='#fbbf24';}
    else if(s<90){bar.style.background='#34d399';lbl.textContent='Strong';lbl.style.color='#34d399';}
    else{bar.style.background='var(--teal)';lbl.textContent='Very Strong';lbl.style.color='var(--teal)';}
  }
  function genBulk(){
    const len=parseInt(document.getElementById('pwLen').value);
    const n=Math.min(50,parseInt(document.getElementById('bulkCount').value)||5);
    const pws=Array.from({length:n},()=>genPw(len)).join('\n');
    const el=document.getElementById('bulkOut');
    el.textContent=pws; el.style.display='';
  }
  generate();
</script>
</body></html>
