<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan to PDF — EasyToolz</title>
  <meta name="description" content="Free Scan to PDF — use your camera to capture pages and convert them to a PDF in your browser." />
  <link rel="canonical" href="https://easytoolz.click/tools/scan-to-pdf.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Scan to PDF</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon pdf">📸</div><div><h1>Scan to PDF</h1><p>Capture pages with your camera and save as PDF — free, browser-only</p></div></div>
  <div class="tool-layout full-width" style="max-width:680px;">
    <div class="tool-box">
      <div id="cameraArea">
        <div style="background:#000;border-radius:var(--radius);overflow:hidden;position:relative;margin-bottom:16px;">
          <video id="video" autoplay playsinline style="width:100%;display:block;max-height:400px;object-fit:cover;"></video>
          <div id="noCam" style="display:none;padding:40px;text-align:center;color:#94a3b8;font-size:.9rem;">📷 Camera not started</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
          <button class="btn btn-primary" id="startBtn" onclick="startCamera()">📷 Start Camera</button>
          <button class="btn btn-secondary" id="capBtn" onclick="capture()" disabled>📸 Capture Page</button>
          <button class="btn btn-secondary" onclick="stopCamera()" id="stopBtn" style="display:none;">■ Stop Camera</button>
        </div>
        <div style="font-size:.8rem;color:var(--text-3);margin-bottom:8px;">Or upload image files directly:</div>
        <input type="file" id="fileInput" accept="image/*" multiple onchange="addFiles(this.files)" style="display:block;font-size:.85rem;color:var(--text-2);margin-bottom:16px;" />
      </div>
      <div id="pages" style="margin:16px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;"></div>
      <div id="pagesActions" style="display:none;margin-top:8px;">
        <div style="font-size:.82rem;color:var(--text-3);margin-bottom:10px;" id="pageCount"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <select id="pgSize" class="form-select" style="width:auto;"><option value="a4">A4</option><option value="letter">Letter</option></select>
          <button class="btn btn-primary" onclick="makePDF()">📄 Create PDF</button>
          <button class="btn btn-secondary" onclick="clearPages()">✕ Clear All</button>
        </div>
      </div>
      <div id="loading" style="display:none;text-align:center;padding:16px;color:var(--text-2);">⏳ Creating PDF…</div>
      <div id="errMsg" style="display:none;color:#f87171;margin-top:12px;"></div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/main.js"></script>
<script>
const { jsPDF } = window.jspdf;
let stream=null, capturedImages=[];
const video=document.getElementById('video');

async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    video.srcObject=stream;
    document.getElementById('noCam').style.display='none';
    document.getElementById('capBtn').disabled=false;
    document.getElementById('stopBtn').style.display='';
    document.getElementById('startBtn').style.display='none';
  }catch(e){showErr('Camera access denied: '+e.message);}
}
function stopCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;video.srcObject=null;
  document.getElementById('startBtn').style.display='';
  document.getElementById('stopBtn').style.display='none';
  document.getElementById('capBtn').disabled=true;
}
function capture(){
  if(!stream)return;
  const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;
  c.getContext('2d').drawImage(video,0,0);
  addImageData(c.toDataURL('image/jpeg',.9));
}
function addFiles(files){
  Array.from(files).forEach(f=>{
    if(!f.type.startsWith('image/'))return;
    const reader=new FileReader();
    reader.onload=e=>addImageData(e.target.result);
    reader.readAsDataURL(f);
  });
}
function addImageData(dataUrl){
  capturedImages.push(dataUrl);
  renderPages();
}
function renderPages(){
  const grid=document.getElementById('pages');
  grid.innerHTML='';
  capturedImages.forEach((src,i)=>{
    const div=document.createElement('div');div.style.cssText='position:relative;';
    div.innerHTML=`<img src="${src}" style="width:100%;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--border);">
      <div style="font-size:.65rem;color:var(--text-3);text-align:center;margin-top:2px;">Page ${i+1}</div>
      <button onclick="removePage(${i})" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);border:none;border-radius:50%;width:18px;height:18px;color:#fff;cursor:pointer;font-size:.6rem;">✕</button>`;
    grid.appendChild(div);
  });
  const show=capturedImages.length>0;
  document.getElementById('pagesActions').style.display=show?'':'none';
  document.getElementById('pageCount').textContent=`${capturedImages.length} page${capturedImages.length!==1?'s':''} captured`;
}
function removePage(i){capturedImages.splice(i,1);renderPages();}
function clearPages(){capturedImages=[];renderPages();}
async function makePDF(){
  if(!capturedImages.length)return;
  document.getElementById('loading').style.display='block';
  await new Promise(r=>setTimeout(r,30));
  const size=document.getElementById('pgSize').value;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:size});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
  capturedImages.forEach((src,i)=>{
    if(i>0)pdf.addPage();
    const img=new Image();img.src=src;
    const ratio=Math.min(pw/img.width,ph/img.height);
    const w=img.width*ratio,h=img.height*ratio;
    pdf.addImage(src,'JPEG',(pw-w)/2,(ph-h)/2,w,h);
  });
  pdf.save('scan.pdf');
  document.getElementById('loading').style.display='none';
}
function showErr(m){document.getElementById('errMsg').textContent=m;document.getElementById('errMsg').style.display='block';}
</script>
<style>
.tool-page-icon.pdf{background:rgba(251,146,60,.15);color:#fb923c}
</style>
</body></html>
