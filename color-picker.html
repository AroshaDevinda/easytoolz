<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Picker — EasyToolz</title>
  <meta name="description" content="Free online Color Picker — pick any color and get HEX, RGB, and HSL codes instantly." />
  <link rel="canonical" href="https://easytoolz.click/tools/color-picker.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Color Picker</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon developer">🎨</div><div><h1>Color Picker</h1><p>Pick any color and get HEX, RGB, HSL codes</p></div></div>
  <div class="tool-layout full-width" style="max-width:600px;">
    <div class="tool-box">
      <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px;">
        <input type="color" id="colorPicker" value="#00d4aa" oninput="updateColor()" style="width:80px;height:80px;border:none;background:none;cursor:pointer;border-radius:12px;overflow:hidden;" />
        <div id="colorPreview" style="flex:1;height:80px;border-radius:12px;background:#00d4aa;transition:background 0.2s;"></div>
      </div>
      <!-- Color codes -->
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <label style="font-size:0.8rem;color:var(--text-3);width:36px;">HEX</label>
          <input id="hexInput" class="form-input" style="flex:1;font-family:monospace;" value="#00d4aa" oninput="fromHex()" />
          <button class="btn btn-sm btn-secondary" onclick="copyText(document.getElementById('hexInput').value,this)">Copy</button>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <label style="font-size:0.8rem;color:var(--text-3);width:36px;">RGB</label>
          <input id="rgbInput" class="form-input" style="flex:1;font-family:monospace;" value="rgb(0, 212, 170)" oninput="fromRgb()" />
          <button class="btn btn-sm btn-secondary" onclick="copyText(document.getElementById('rgbInput').value,this)">Copy</button>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <label style="font-size:0.8rem;color:var(--text-3);width:36px;">HSL</label>
          <input id="hslInput" class="form-input" style="flex:1;font-family:monospace;" value="hsl(168, 100%, 42%)" readonly />
          <button class="btn btn-sm btn-secondary" onclick="copyText(document.getElementById('hslInput').value,this)">Copy</button>
        </div>
      </div>
      <hr class="divider"/>
      <h4 style="font-size:0.875rem;margin-bottom:12px;">Preset Colors</h4>
      <div class="color-swatches">
        <div class="swatch" style="background:#f87171" onclick="setColor('#f87171')"></div>
        <div class="swatch" style="background:#fb923c" onclick="setColor('#fb923c')"></div>
        <div class="swatch" style="background:#fbbf24" onclick="setColor('#fbbf24')"></div>
        <div class="swatch" style="background:#34d399" onclick="setColor('#34d399')"></div>
        <div class="swatch" style="background:#00d4aa" onclick="setColor('#00d4aa')"></div>
        <div class="swatch" style="background:#38bdf8" onclick="setColor('#38bdf8')"></div>
        <div class="swatch" style="background:#818cf8" onclick="setColor('#818cf8')"></div>
        <div class="swatch" style="background:#c084fc" onclick="setColor('#c084fc')"></div>
        <div class="swatch" style="background:#f472b6" onclick="setColor('#f472b6')"></div>
        <div class="swatch" style="background:#ffffff" onclick="setColor('#ffffff')"></div>
        <div class="swatch" style="background:#64748b" onclick="setColor('#64748b')"></div>
        <div class="swatch" style="background:#0f172a" onclick="setColor('#0f172a')"></div>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="../js/main.js"></script>
<script>
  function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b};}
  function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
  function updateColor(){
    const hex=document.getElementById('colorPicker').value;
    const{r,g,b}=hexToRgb(hex);
    const{h,s,l}=rgbToHsl(r,g,b);
    document.getElementById('colorPreview').style.background=hex;
    document.getElementById('hexInput').value=hex;
    document.getElementById('rgbInput').value=`rgb(${r}, ${g}, ${b})`;
    document.getElementById('hslInput').value=`hsl(${h}, ${s}%, ${l}%)`;
  }
  function setColor(hex){document.getElementById('colorPicker').value=hex;updateColor();}
  function fromHex(){
    const v=document.getElementById('hexInput').value.trim();
    if(/^#[0-9A-Fa-f]{6}$/.test(v)){document.getElementById('colorPicker').value=v;updateColor();}
  }
  function fromRgb(){
    const v=document.getElementById('rgbInput').value;
    const m=v.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
    if(m){const hex='#'+[m[1],m[2],m[3]].map(x=>parseInt(x).toString(16).padStart(2,'0')).join('');document.getElementById('colorPicker').value=hex;updateColor();}
  }
</script>
</body></html>
