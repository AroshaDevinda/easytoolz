<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Sign — EasyToolz</title>
  <meta name="description" content="Free PDF Sign tool — draw your signature and embed it in a PDF in your browser. No upload needed." />
  <link rel="canonical" href="https://easytoolz.click/tools/pdf-sign.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Sign PDF</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon pdf">✍️</div><div><h1>Sign PDF</h1><p>Draw your signature and embed it into any PDF — free & browser-only</p></div></div>
  <div class="tool-layout full-width" style="max-width:720px;">
    <div class="tool-box">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
        <div class="drop-icon">📄</div>
        <div class="drop-text">Click or drag & drop a PDF here</div>
        <div class="drop-sub">File never leaves your device</div>
        <input type="file" id="pdfInput" accept=".pdf,application/pdf" style="display:none" onchange="loadPDF(this.files[0])" />
      </div>
      <div id="controls" style="display:none;margin-top:20px;">
        <div id="fileInfo" style="font-size:.85rem;color:var(--text-3);margin-bottom:16px;"></div>
        <div style="margin-bottom:16px;">
          <label class="form-label">Step 1 — Draw your signature below</label>
          <div style="position:relative;background:#fff;border-radius:var(--radius);border:2px dashed rgba(0,0,0,.2);overflow:hidden;">
            <canvas id="sigCanvas" width="640" height="180" style="display:block;width:100%;cursor:crosshair;touch-action:none;"></canvas>
            <div id="sigHint" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#94a3b8;font-size:.9rem;pointer-events:none;">Sign here</div>
          </div>
          <div style="display:flex;gap:10px;margin-top:8px;">
            <button class="btn btn-secondary btn-sm" onclick="clearSig()">✕ Clear</button>
            <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
              <label style="font-size:.8rem;color:var(--text-3);">Color:</label>
              <input type="color" id="inkColor" value="#000000" style="width:32px;height:28px;border:none;border-radius:4px;cursor:pointer;" />
              <label style="font-size:.8rem;color:var(--text-3);">Size:</label>
              <input type="range" id="inkSize" min="1" max="8" value="2" style="width:80px;accent-color:var(--teal);" />
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Step 2 — Page to sign</label>
            <input type="number" id="pageNum" class="form-input" value="1" min="1" />
          </div>
          <div class="form-group">
            <label class="form-label">Position</label>
            <select id="sigPos" class="form-select">
              <option value="bottom-right">Bottom Right</option>
              <option value="bottom-left">Bottom Left</option>
              <option value="bottom-center">Bottom Center</option>
              <option value="center">Center</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Signature size (% of page width)</label>
          <input type="range" id="sigSize" min="10" max="60" value="30" style="width:100%;accent-color:var(--teal);" oninput="document.getElementById('sigSizeVal').textContent=this.value+'%'" />
          <span id="sigSizeVal" style="font-size:.8rem;color:var(--text-3);">30%</span>
        </div>
        <button class="btn btn-primary btn-block" onclick="doSign()">✍️ Embed Signature & Download</button>
        <div id="loading" style="display:none;text-align:center;padding:16px;color:var(--text-2);">⏳ Embedding signature…</div>
        <div id="errMsg" style="display:none;color:#f87171;margin-top:12px;"></div>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../js/main.js"></script>
<script>
const { PDFDocument } = PDFLib;
let rawBuf=null, totalPages=0, fileName='';
let drawing=false, lastX=0, lastY=0, hasSig=false;
const canvas=document.getElementById('sigCanvas');
const ctx=canvas.getContext('2d');
ctx.lineCap='round'; ctx.lineJoin='round';

function getPos(e){
  const r=canvas.getBoundingClientRect();
  const scaleX=canvas.width/r.width, scaleY=canvas.height/r.height;
  const src=e.touches?e.touches[0]:e;
  return{x:(src.clientX-r.left)*scaleX,y:(src.clientY-r.top)*scaleY};
}
canvas.addEventListener('mousedown',e=>{drawing=true;const p=getPos(e);lastX=p.x;lastY=p.y;document.getElementById('sigHint').style.display='none';hasSig=true;});
canvas.addEventListener('mousemove',e=>{if(!drawing)return;draw(getPos(e));});
canvas.addEventListener('mouseup',()=>drawing=false);
canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=getPos(e);lastX=p.x;lastY=p.y;document.getElementById('sigHint').style.display='none';hasSig=true;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;draw(getPos(e));},{passive:false});
canvas.addEventListener('touchend',()=>drawing=false);
function draw(p){
  ctx.beginPath();
  ctx.strokeStyle=document.getElementById('inkColor').value;
  ctx.lineWidth=parseInt(document.getElementById('inkSize').value);
  ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();
  lastX=p.x;lastY=p.y;
}
function clearSig(){ctx.clearRect(0,0,canvas.width,canvas.height);hasSig=false;document.getElementById('sigHint').style.display='';}

const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');loadPDF(e.dataTransfer.files[0]);});

async function loadPDF(file){
  if(!file||file.type!=='application/pdf'){showErr('Please select a valid PDF.');return;}
  fileName=file.name.replace(/\.pdf$/i,'');
  rawBuf=await file.arrayBuffer();
  try{
    const d=await PDFDocument.load(rawBuf);
    totalPages=d.getPageCount();
    document.getElementById('fileInfo').textContent=`📄 ${file.name} · ${totalPages} pages`;
    document.getElementById('pageNum').max=totalPages;
    document.getElementById('controls').style.display='';
  }catch(e){showErr('Could not read PDF.');}
}
async function doSign(){
  if(!rawBuf){showErr('Please upload a PDF first.');return;}
  if(!hasSig){showErr('Please draw your signature first.');return;}
  document.getElementById('loading').style.display='block';
  document.getElementById('errMsg').style.display='none';
  try{
    const pdfDoc=await PDFDocument.load(rawBuf);
    const pages=pdfDoc.getPages();
    const pageIdx=Math.min(parseInt(document.getElementById('pageNum').value)||1,totalPages)-1;
    const page=pages[pageIdx];
    const{width,height}=page.getSize();
    // Get signature as PNG from canvas (trimmed)
    const sigPng=canvas.toDataURL('image/png');
    const imgBytes=await fetch(sigPng).then(r=>r.arrayBuffer());
    const pngImg=await pdfDoc.embedPng(imgBytes);
    const sigW=width*(parseInt(document.getElementById('sigSize').value)/100);
    const sigH=(pngImg.height/pngImg.width)*sigW;
    const pos=document.getElementById('sigPos').value;
    const pad=20;
    let x,y;
    if(pos==='bottom-right'){x=width-sigW-pad;y=pad;}
    else if(pos==='bottom-left'){x=pad;y=pad;}
    else if(pos==='bottom-center'){x=(width-sigW)/2;y=pad;}
    else{x=(width-sigW)/2;y=(height-sigH)/2;}
    page.drawImage(pngImg,{x,y,width:sigW,height:sigH,opacity:.9});
    const bytes=await pdfDoc.save();
    const blob=new Blob([bytes],{type:'application/pdf'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${fileName}-signed.pdf`;a.click();
  }catch(e){showErr('Failed: '+e.message);}
  document.getElementById('loading').style.display='none';
}
function showErr(m){document.getElementById('errMsg').textContent=m;document.getElementById('errMsg').style.display='block';}
</script>
<style>
.drop-zone{border:2px dashed var(--border-hover);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--teal);background:rgba(0,212,170,.04)}
.drop-icon{font-size:3rem;margin-bottom:12px}.drop-text{font-weight:600;margin-bottom:6px}.drop-sub{font-size:.8rem;color:var(--text-3)}
</style>
</body></html>
