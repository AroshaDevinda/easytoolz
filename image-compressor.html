<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Compressor — EasyToolz</title>
  <meta name="description" content="Free online Image Compressor — compress JPEG and PNG images without losing quality, directly in your browser." />
  <link rel="canonical" href="https://easytoolz.click/tools/image-compressor.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Image Compressor</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon images">🖼️</div><div><h1>Image Compressor</h1><p>Compress images without losing quality — 100% in browser</p></div></div>
  <div class="tool-layout">
    <div class="tool-box">
      <!-- Drop zone -->
      <div id="dropZone" style="border:2px dashed var(--border);border-radius:var(--radius);padding:40px;text-align:center;cursor:pointer;transition:all 0.2s;" onclick="document.getElementById('imgInput').click()" ondragover="event.preventDefault();this.style.borderColor='var(--teal)'" ondragleave="this.style.borderColor='var(--border)'" ondrop="handleDrop(event)">
        <div style="font-size:2.5rem;margin-bottom:8px;">📁</div>
        <div style="font-weight:600;margin-bottom:4px;">Drop image here or click to browse</div>
        <div style="font-size:0.8rem;color:var(--text-3);">Supports JPG, PNG, WebP</div>
        <input type="file" id="imgInput" accept="image/*" style="display:none;" onchange="loadImage(this.files[0])" />
      </div>
      <!-- Quality slider -->
      <div class="form-group" style="margin-top:20px;">
        <label class="form-label">Quality: <strong id="qualityLabel" style="color:var(--teal)">80%</strong></label>
        <div class="range-wrap"><span>1%</span><input type="range" id="quality" min="1" max="100" value="80" oninput="document.getElementById('qualityLabel').textContent=this.value+'%';compress()" /><span>100%</span></div>
      </div>
      <!-- Preview -->
      <div id="previewArea" style="display:none;margin-top:20px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
          <div>
            <div style="font-size:0.8rem;color:var(--text-3);margin-bottom:6px;">Original — <span id="origSize"></span></div>
            <img id="origImg" style="width:100%;border-radius:8px;border:1px solid var(--border);" />
          </div>
          <div>
            <div style="font-size:0.8rem;color:var(--text-3);margin-bottom:6px;">Compressed — <span id="compSize"></span></div>
            <img id="compImg" style="width:100%;border-radius:8px;border:1px solid var(--border);" />
          </div>
        </div>
        <div id="savingsBadge" style="text-align:center;margin-bottom:12px;font-size:0.9rem;color:var(--teal);font-weight:700;"></div>
        <button class="btn btn-primary btn-block" onclick="download()">⬇ Download Compressed Image</button>
      </div>
    </div>
    <div class="sidebar"><div class="ad-slot"><p>Advertisement</p></div></div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="../js/main.js"></script>
<script>
  let origFile=null, compDataUrl=null, canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');
  function fmt(b){return b>1048576?(b/1048576).toFixed(2)+' MB':b>1024?(b/1024).toFixed(1)+' KB':b+' B';}
  function handleDrop(e){e.preventDefault();document.getElementById('dropZone').style.borderColor='var(--border)';const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))loadImage(f);}
  function loadImage(f){
    if(!f)return; origFile=f;
    const url=URL.createObjectURL(f);
    document.getElementById('origImg').src=url;
    document.getElementById('origSize').textContent=fmt(f.size);
    const img=new Image();
    img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0);compress();};
    img.src=url;
    document.getElementById('previewArea').style.display='';
  }
  function compress(){
    if(!origFile)return;
    const q=parseInt(document.getElementById('quality').value)/100;
    const mimeType=origFile.type==='image/png'?'image/png':'image/jpeg';
    compDataUrl=canvas.toDataURL(mimeType,q);
    document.getElementById('compImg').src=compDataUrl;
    // Estimate size
    const b64=compDataUrl.split(',')[1];
    const bytes=Math.round(b64.length*0.75);
    const saving=Math.round((1-bytes/origFile.size)*100);
    document.getElementById('compSize').textContent=fmt(bytes);
    document.getElementById('savingsBadge').textContent=saving>0?'🎉 Saved '+saving+'% ('+fmt(origFile.size-bytes)+')':'No savings at this quality level';
  }
  function download(){
    if(!compDataUrl)return;
    const a=document.createElement('a');
    a.href=compDataUrl;
    a.download='compressed_'+origFile.name;
    a.click();
  }
</script>
</body></html>
