<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discount Calculator — EasyToolz</title>
  <meta name="description" content="Free Discount Calculator — find the final price after any discount percentage instantly." />
  <link rel="canonical" href="https://easytoolz.click/tools/discount-calculator.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Discount Calculator</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon calculators">🏷️</div><div><h1>Discount Calculator</h1><p>Find the final price after any discount</p></div></div>
  <div class="tool-layout full-width" style="max-width:600px;">
    <div class="tool-box">
      <div class="form-group"><label class="form-label">Original Price</label><input type="number" id="origPrice" class="form-input" placeholder="e.g. 1000" oninput="calc()" /></div>
      <div class="form-group">
        <label class="form-label">Discount: <strong id="discLabel" style="color:var(--teal)">10%</strong></label>
        <div class="range-wrap">
          <span>0%</span>
          <input type="range" id="discPct" min="0" max="90" value="10" oninput="document.getElementById('discLabel').textContent=this.value+'%';calc()" />
          <span>90%</span>
        </div>
      </div>
      <div id="discResult" style="display:none;margin-top:8px;">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
          <div style="background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:0.75rem;color:var(--text-3);margin-bottom:6px;">Final Price</div>
            <div id="finalPrice" style="font-size:1.3rem;font-weight:800;color:#34d399;"></div>
          </div>
          <div style="background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:0.75rem;color:var(--text-3);margin-bottom:6px;">You Save</div>
            <div id="savings" style="font-size:1.3rem;font-weight:800;color:#f87171;"></div>
          </div>
          <div style="background:rgba(0,212,170,0.08);border:1px solid rgba(0,212,170,0.2);border-radius:12px;padding:16px;text-align:center;">
            <div style="font-size:0.75rem;color:var(--text-3);margin-bottom:6px;">Discount</div>
            <div id="discAmt" style="font-size:1.3rem;font-weight:800;color:var(--teal);"></div>
          </div>
        </div>
      </div>
      <hr class="divider" />
      <h3 style="font-size:1rem;margin-bottom:16px;">Reverse: Find Original Price</h3>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Sale Price</label><input type="number" id="salePrice" class="form-input" placeholder="e.g. 800" /></div>
        <div class="form-group"><label class="form-label">Discount %</label><input type="number" id="discPctRev" class="form-input" placeholder="e.g. 20" /></div>
      </div>
      <button class="btn btn-secondary" onclick="calcRev()">Find Original Price</button>
      <div class="result-box" id="revResult" style="margin-top:12px;">
        <div class="result-value" id="revVal"></div>
        <div class="result-label">Original Price</div>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="../js/main.js"></script>
<script>
  function calc(){
    const orig=parseFloat(document.getElementById('origPrice').value)||0;
    const pct=parseFloat(document.getElementById('discPct').value)||0;
    const saved=orig*pct/100, final=orig-saved;
    document.getElementById('finalPrice').textContent = '$'+final.toFixed(2);
    document.getElementById('savings').textContent    = '$'+saved.toFixed(2);
    document.getElementById('discAmt').textContent    = pct+'%';
    document.getElementById('discResult').style.display = orig>0?'':'none';
  }
  function calcRev(){
    const sale=parseFloat(document.getElementById('salePrice').value);
    const pct=parseFloat(document.getElementById('discPctRev').value);
    if(!sale||!pct||pct>=100)return alert('Please enter valid values.');
    const orig=sale/(1-pct/100);
    document.getElementById('revVal').textContent='$'+orig.toFixed(2);
    document.getElementById('revResult').classList.add('show');
  }
</script>
</body></html>
