<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timer — EasyToolz</title>
  <meta name="description" content="Free online countdown timer — set a countdown for any duration with an alert sound." />
  <link rel="canonical" href="https://easytoolz.click/tools/countdown-timer.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Countdown Timer</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon daily">⏳</div><div><h1>Countdown Timer</h1><p>Set a countdown timer for any duration</p></div></div>
  <div class="tool-layout full-width" style="max-width:600px;">
    <div class="tool-box" style="text-align:center;">
      <div class="form-row" style="margin-bottom:24px;">
        <div class="form-group"><label class="form-label">Hours</label><input type="number" id="cHours" class="form-input" value="0" min="0" max="23" style="text-align:center;font-size:1.5rem;font-weight:700;" /></div>
        <div class="form-group"><label class="form-label">Minutes</label><input type="number" id="cMins" class="form-input" value="5" min="0" max="59" style="text-align:center;font-size:1.5rem;font-weight:700;" /></div>
        <div class="form-group"><label class="form-label">Seconds</label><input type="number" id="cSecs" class="form-input" value="0" min="0" max="59" style="text-align:center;font-size:1.5rem;font-weight:700;" /></div>
      </div>
      <div id="cdDisplay" class="time-display" style="font-size:5rem;">00:05:00</div>
      <div style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
        <button class="btn btn-sm btn-secondary" onclick="preset(1,0,0)">1 hr</button>
        <button class="btn btn-sm btn-secondary" onclick="preset(0,30,0)">30 min</button>
        <button class="btn btn-sm btn-secondary" onclick="preset(0,10,0)">10 min</button>
        <button class="btn btn-sm btn-secondary" onclick="preset(0,5,0)">5 min</button>
        <button class="btn btn-sm btn-secondary" onclick="preset(0,1,0)">1 min</button>
      </div>
      <div class="time-controls">
        <button class="btn btn-primary" id="cdBtn" onclick="startStop()">▶ Start</button>
        <button class="btn btn-danger" onclick="reset()">↺ Reset</button>
      </div>
      <div id="doneMsg" style="display:none;margin-top:20px;background:rgba(0,212,170,0.1);border:1px solid rgba(0,212,170,0.3);border-radius:12px;padding:20px;">
        <div style="font-size:2rem;">🎉</div>
        <div style="font-weight:700;color:var(--teal);">Time's up!</div>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="../js/main.js"></script>
<script>
let remaining=0, interval=null, running=false;
function pad(n){return(n<10?'0':'')+n;}
function fmtTime(s){return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);}
function updateDisplay(){document.getElementById('cdDisplay').textContent=fmtTime(remaining);}
function preset(h,m,s){
  document.getElementById('cHours').value=h;
  document.getElementById('cMins').value=m;
  document.getElementById('cSecs').value=s;
  if(!running){remaining=h*3600+m*60+s;updateDisplay();}
}
function startStop(){
  if(running){clearInterval(interval);running=false;document.getElementById('cdBtn').textContent='▶ Resume';return;}
  if(!running&&remaining===0){
    const h=parseInt(document.getElementById('cHours').value)||0;
    const m=parseInt(document.getElementById('cMins').value)||0;
    const s=parseInt(document.getElementById('cSecs').value)||0;
    remaining=h*3600+m*60+s;
    if(remaining===0)return;
  }
  document.getElementById('doneMsg').style.display='none';
  running=true;
  document.getElementById('cdBtn').textContent='⏸ Pause';
  interval=setInterval(()=>{
    remaining--;
    updateDisplay();
    if(remaining<=0){
      clearInterval(interval); running=false;
      document.getElementById('cdBtn').textContent='▶ Start';
      document.getElementById('doneMsg').style.display='';
      beep();
    }
  },1000);
}
function reset(){clearInterval(interval);running=false;remaining=0;document.getElementById('cdBtn').textContent='▶ Start';document.getElementById('doneMsg').style.display='none';updateDisplay();}
function beep(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1);o.start();o.stop(ctx.currentTime+1);}catch(e){}}
// Init display
window.onload=()=>updateDisplay();
</script>
</body></html>
