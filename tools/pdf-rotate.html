<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rotate PDF — EasyToolz</title>
  <meta name="description" content="Free PDF Rotate tool — rotate all or specific pages of a PDF 90°, 180°, or 270° in your browser. No upload needed." />
  <link rel="canonical" href="https://easytoolz.click/tools/pdf-rotate.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Rotate PDF</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon pdf">🔄</div><div><h1>Rotate PDF</h1><p>Rotate PDF pages 90°, 180°, or 270° — free, no upload needed</p></div></div>
  <div class="tool-layout full-width" style="max-width:680px;">
    <div class="tool-box">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
        <div class="drop-icon">📄</div>
        <div class="drop-text">Click or drag & drop a PDF here</div>
        <div class="drop-sub">File stays on your device — never uploaded</div>
        <input type="file" id="pdfInput" accept=".pdf,application/pdf" style="display:none" onchange="loadPDF(this.files[0])" />
      </div>
      <div id="controls" style="display:none;margin-top:20px;">
        <div id="fileInfo" style="font-size:.85rem;color:var(--text-3);margin-bottom:16px;"></div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Rotation Angle</label>
            <select id="angle" class="form-select">
              <option value="90">90° Clockwise</option>
              <option value="180">180° (Upside down)</option>
              <option value="270">90° Counter-clockwise</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Apply to</label>
            <select id="applyTo" class="form-select" onchange="togglePageInput()">
              <option value="all">All pages</option>
              <option value="odd">Odd pages only</option>
              <option value="even">Even pages only</option>
              <option value="custom">Specific pages</option>
            </select>
          </div>
        </div>
        <div id="customPages" class="form-group" style="display:none;">
          <label class="form-label">Page numbers <span style="color:var(--text-3);font-weight:400;">(e.g. 1, 3-5, 7)</span></label>
          <input type="text" id="pageList" class="form-input" placeholder="1, 3-5, 7" />
        </div>
        <button class="btn btn-primary btn-block" onclick="doRotate()">🔄 Rotate & Download</button>
        <div id="loading" style="display:none;text-align:center;padding:16px;color:var(--text-2);">⏳ Rotating…</div>
        <div id="errMsg" style="display:none;color:#f87171;margin-top:12px;"></div>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../js/main.js"></script>
<script>
const { PDFDocument, degrees } = PDFLib;
let pdfDoc=null, totalPages=0, fileName='', rawBuf=null;

const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');loadPDF(e.dataTransfer.files[0]);});

async function loadPDF(file){
  if(!file||file.type!=='application/pdf'){showErr('Please select a valid PDF.');return;}
  fileName=file.name.replace(/\.pdf$/i,'');
  rawBuf=await file.arrayBuffer();
  try{
    pdfDoc=await PDFDocument.load(rawBuf);
    totalPages=pdfDoc.getPageCount();
    document.getElementById('fileInfo').textContent=`📄 ${file.name} · ${totalPages} pages`;
    document.getElementById('controls').style.display='';
    document.getElementById('errMsg').style.display='none';
  }catch(e){showErr('Could not read PDF.');}
}
function togglePageInput(){document.getElementById('customPages').style.display=document.getElementById('applyTo').value==='custom'?'':'none';}
function parsePageList(str){
  const pages=[];
  str.split(',').map(s=>s.trim()).filter(Boolean).forEach(p=>{
    if(p.includes('-')){const[a,b]=p.split('-').map(Number);for(let i=a;i<=b;i++)pages.push(i);}
    else{const n=parseInt(p);if(!isNaN(n))pages.push(n);}
  });
  return pages;
}
async function doRotate(){
  if(!pdfDoc)return;
  document.getElementById('loading').style.display='block';
  document.getElementById('errMsg').style.display='none';
  try{
    // reload fresh copy
    const freshDoc=await PDFDocument.load(rawBuf);
    const pages=freshDoc.getPages();
    const angle=parseInt(document.getElementById('angle').value);
    const applyTo=document.getElementById('applyTo').value;
    let targetIndices;
    if(applyTo==='all') targetIndices=[...Array(totalPages).keys()];
    else if(applyTo==='odd') targetIndices=[...Array(totalPages).keys()].filter(i=>i%2===0);
    else if(applyTo==='even') targetIndices=[...Array(totalPages).keys()].filter(i=>i%2===1);
    else targetIndices=parsePageList(document.getElementById('pageList').value).map(n=>n-1).filter(i=>i>=0&&i<totalPages);
    targetIndices.forEach(i=>{
      const cur=pages[i].getRotation().angle;
      pages[i].setRotation(degrees((cur+angle)%360));
    });
    const bytes=await freshDoc.save();
    const blob=new Blob([bytes],{type:'application/pdf'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${fileName}-rotated.pdf`;a.click();
  }catch(e){showErr('Failed: '+e.message);}
  document.getElementById('loading').style.display='none';
}
function showErr(m){document.getElementById('errMsg').textContent=m;document.getElementById('errMsg').style.display='block';}
</script>
<style>
.drop-zone{border:2px dashed var(--border-hover);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--teal);background:rgba(0,212,170,.04)}
.drop-icon{font-size:3rem;margin-bottom:12px}.drop-text{font-weight:600;margin-bottom:6px}.drop-sub{font-size:.8rem;color:var(--text-3)}
</style>
</body></html>
