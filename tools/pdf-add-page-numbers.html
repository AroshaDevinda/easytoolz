<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Add Page Numbers — EasyToolz</title>
  <meta name="description" content="Free tool to add page numbers to any PDF — choose position, font size, and format. No upload needed." />
  <link rel="canonical" href="https://easytoolz.click/tools/pdf-add-page-numbers.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Add Page Numbers</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon pdf">🔢</div><div><h1>Add Page Numbers to PDF</h1><p>Add customizable page numbers to your PDF — free, browser-only</p></div></div>
  <div class="tool-layout full-width" style="max-width:680px;">
    <div class="tool-box">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
        <div class="drop-icon">📄</div>
        <div class="drop-text">Click or drag & drop a PDF here</div>
        <div class="drop-sub">File never leaves your device</div>
        <input type="file" id="pdfInput" accept=".pdf,application/pdf" style="display:none" onchange="loadPDF(this.files[0])" />
      </div>
      <div id="controls" style="display:none;margin-top:20px;">
        <div id="fileInfo" style="font-size:.85rem;color:var(--text-3);margin-bottom:16px;"></div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Position</label>
            <select id="position" class="form-select">
              <option value="bottom-center">Bottom Center</option>
              <option value="bottom-right">Bottom Right</option>
              <option value="bottom-left">Bottom Left</option>
              <option value="top-center">Top Center</option>
              <option value="top-right">Top Right</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Format</label>
            <select id="format" class="form-select">
              <option value="num">1, 2, 3 …</option>
              <option value="page-of">Page 1 of N</option>
              <option value="dash">— 1 —</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Font Size (pt)</label>
            <input type="number" id="fontSize" class="form-input" value="12" min="6" max="36" />
          </div>
          <div class="form-group">
            <label class="form-label">Start from page</label>
            <input type="number" id="startPage" class="form-input" value="1" min="1" />
          </div>
        </div>
        <button class="btn btn-primary btn-block" onclick="doAddNumbers()">🔢 Add Page Numbers & Download</button>
        <div id="loading" style="display:none;text-align:center;padding:16px;color:var(--text-2);">⏳ Adding page numbers…</div>
        <div id="errMsg" style="display:none;color:#f87171;margin-top:12px;"></div>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../js/main.js"></script>
<script>
const { PDFDocument, StandardFonts, rgb } = PDFLib;
let rawBuf=null, totalPages=0, fileName='';

const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');loadPDF(e.dataTransfer.files[0]);});

async function loadPDF(file){
  if(!file||file.type!=='application/pdf'){showErr('Please select a valid PDF.');return;}
  fileName=file.name.replace(/\.pdf$/i,'');
  rawBuf=await file.arrayBuffer();
  try{
    const d=await PDFDocument.load(rawBuf);
    totalPages=d.getPageCount();
    document.getElementById('fileInfo').textContent=`📄 ${file.name} · ${totalPages} pages`;
    document.getElementById('startPage').max=totalPages;
    document.getElementById('controls').style.display='';
  }catch(e){showErr('Could not read PDF.');}
}
async function doAddNumbers(){
  if(!rawBuf)return;
  document.getElementById('loading').style.display='block';
  document.getElementById('errMsg').style.display='none';
  try{
    const pdfDoc=await PDFDocument.load(rawBuf);
    const font=await pdfDoc.embedFont(StandardFonts.Helvetica);
    const pages=pdfDoc.getPages();
    const pos=document.getElementById('position').value;
    const fmt=document.getElementById('format').value;
    const fs=parseInt(document.getElementById('fontSize').value)||12;
    const startPage=parseInt(document.getElementById('startPage').value)||1;
    const pad=24;
    pages.forEach((page,i)=>{
      const {width,height}=page.getSize();
      const pageNum=i+1;
      if(pageNum<startPage)return;
      const displayNum=pageNum-startPage+1;
      let label;
      if(fmt==='num')label=String(displayNum);
      else if(fmt==='page-of')label=`Page ${displayNum} of ${totalPages-startPage+1}`;
      else label=`\u2014 ${displayNum} \u2014`;
      const tw=font.widthOfTextAtSize(label,fs);
      let x,y;
      if(pos==='bottom-center'){x=(width-tw)/2;y=pad;}
      else if(pos==='bottom-right'){x=width-tw-pad;y=pad;}
      else if(pos==='bottom-left'){x=pad;y=pad;}
      else if(pos==='top-center'){x=(width-tw)/2;y=height-pad-fs;}
      else{x=width-tw-pad;y=height-pad-fs;}
      page.drawText(label,{x,y,size:fs,font,color:rgb(0.2,0.2,0.2)});
    });
    const bytes=await pdfDoc.save();
    const blob=new Blob([bytes],{type:'application/pdf'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${fileName}-numbered.pdf`;a.click();
  }catch(e){showErr('Failed: '+e.message);}
  document.getElementById('loading').style.display='none';
}
function showErr(m){document.getElementById('errMsg').textContent=m;document.getElementById('errMsg').style.display='block';}
</script>
<style>
.drop-zone{border:2px dashed var(--border-hover);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--teal);background:rgba(0,212,170,.04)}
.drop-icon{font-size:3rem;margin-bottom:12px}.drop-text{font-weight:600;margin-bottom:6px}.drop-sub{font-size:.8rem;color:var(--text-3)}
</style>
</body></html>
