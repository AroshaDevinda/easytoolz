<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Converter — EasyToolz</title>
  <meta name="description" content="Free Image Converter — convert JPG, PNG, WebP, BMP images to any format in your browser. No upload, 100% private." />
  <link rel="canonical" href="https://easytoolz.click/tools/image-converter.html" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="nav-logo"><div class="logo-icon">⚡</div><span class="brand">EasyToolz</span></a>
  <ul class="nav-links" id="navLinks"><li><a href="../index.html">Home</a></li></ul>
  <button class="nav-toggle" id="navToggle">☰</button>
</div></nav>
<main class="tool-page"><div class="container">
  <nav class="breadcrumb"><a href="../index.html">Home</a><span class="sep">›</span><span class="current">Image Converter</span></nav>
  <div class="tool-page-header"><div class="tool-page-icon images">🔄</div><div><h1>Image Converter</h1><p>Convert JPG ↔ PNG ↔ WebP ↔ BMP — free, browser-only</p></div></div>
  <div class="tool-layout full-width" style="max-width:640px;">
    <div class="tool-box">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('imgInput').click()">
        <div class="drop-icon">🔄</div>
        <div class="drop-text">Click or drag & drop an image here</div>
        <div class="drop-sub">JPG, PNG, WebP, BMP, GIF supported</div>
        <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="loadFile(this.files[0])" />
      </div>
      <div id="controls" style="display:none;margin-top:20px;">
        <div id="preview" style="text-align:center;margin-bottom:16px;">
          <img id="previewImg" style="max-width:100%;max-height:240px;border-radius:var(--radius);border:1px solid var(--border);" />
          <div id="origInfo" style="font-size:0.8rem;color:var(--text-3);margin-top:8px;"></div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:1;">
            <label class="form-label">Convert to</label>
            <select id="fmtSel" class="form-select" onchange="updateQuality()">
              <option value="image/jpeg">JPEG (.jpg)</option>
              <option value="image/png">PNG (.png)</option>
              <option value="image/webp">WebP (.webp)</option>
            </select>
          </div>
          <div class="form-group" style="flex:1;" id="qualityGroup">
            <label class="form-label">Quality: <span id="qualVal">92</span>%</label>
            <input type="range" id="quality" min="10" max="100" value="92" oninput="document.getElementById('qualVal').textContent=this.value" style="width:100%;accent-color:var(--teal);" />
          </div>
        </div>
        <button class="btn btn-primary btn-block" onclick="convert()">🔄 Convert & Download</button>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2025 EasyToolz.click</span></div></div></footer>
<script src="../js/main.js"></script>
<script>
let imgEl = null;

const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]); });

function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      imgEl = img;
      document.getElementById('previewImg').src = e.target.result;
      document.getElementById('origInfo').textContent = `${img.naturalWidth} × ${img.naturalHeight} px · ${(file.size/1024).toFixed(0)} KB · ${file.type}`;
      document.getElementById('controls').style.display = '';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function updateQuality() {
  const fmt = document.getElementById('fmtSel').value;
  document.getElementById('qualityGroup').style.opacity = fmt === 'image/png' ? '0.4' : '1';
}
function convert() {
  if (!imgEl) return;
  const fmt   = document.getElementById('fmtSel').value;
  const q     = parseInt(document.getElementById('quality').value) / 100;
  const ext   = fmt === 'image/png' ? 'png' : fmt === 'image/webp' ? 'webp' : 'jpg';
  const canvas = document.createElement('canvas');
  canvas.width = imgEl.naturalWidth; canvas.height = imgEl.naturalHeight;
  canvas.getContext('2d').drawImage(imgEl, 0, 0);
  const a = document.createElement('a'); a.href = canvas.toDataURL(fmt, q); a.download = `converted.${ext}`; a.click();
}
</script>
<style>
.tool-page-icon.images { background:linear-gradient(135deg,rgba(244,114,182,.15),rgba(244,114,182,.05));color:#f472b6; }
.drop-zone { border:2px dashed var(--border-hover);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s; }
.drop-zone:hover,.drop-zone.drag-over { border-color:var(--teal);background:rgba(0,212,170,.04); }
.drop-icon { font-size:3rem;margin-bottom:12px; }
.drop-text { font-weight:600;margin-bottom:6px; }
.drop-sub  { font-size:.8rem;color:var(--text-3); }
</style>
</body></html>
